<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - ClinicEase</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .page-wrapper {
            display: flex;
            gap: 2rem;
            align-items: stretch;
            max-width: 900px;
            width: 90%;
        }
        .left-panel {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 3rem 2rem;
            color: white;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .left-panel h1 { font-size: 2rem; margin-bottom: 1rem; }
        .left-panel p { opacity: 0.85; line-height: 1.7; margin-bottom: 2rem; }
        .feature { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 14px; opacity: 0.9; }
        .feature span { font-size: 20px; }
        .right-panel {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            flex: 1.2;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        h2 { color: #333; margin-bottom: 0.3rem; font-size: 1.4rem; }
        .subtitle { color: #999; font-size: 13px; margin-bottom: 1.5rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 5px; color: #555; font-size: 13px; font-weight: 500; }
        input, select {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
            outline: none;
            background: white;
        }
        input:focus, select:focus { border-color: #667eea; }
        .register-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 5px;
            transition: opacity 0.2s;
        }
        .register-btn:hover { opacity: 0.9; }
        .login-link { text-align: center; margin-top: 1rem; font-size: 13px; color: #999; }
        .login-link a { color: #667eea; text-decoration: none; font-weight: 500; }
        .error { color: #e74c3c; font-size: 13px; text-align: center; margin-top: 10px; }
        .success { color: #27ae60; font-size: 13px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
<div class="page-wrapper">
    <div class="left-panel">
        <h1>🏥 ClinicEase</h1>
        <p>Join thousands of patients who manage their health appointments with ease.</p>
        <div class="feature"><span>📅</span> Book appointments 24/7</div>
        <div class="feature"><span>👨‍⚕️</span> Choose your doctor</div>
        <div class="feature"><span>🔔</span> Get reminders</div>
        <div class="feature"><span>📋</span> Track your visits</div>
    </div>
    <div class="right-panel">
        <h2>Create Account</h2>
        <p class="subtitle">Register as a patient to book appointments</p>
        <div class="form-row">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Your full name"/>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="your@email.com"/>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create password"/>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="phone" placeholder="10-digit number"/>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Age</label>
                <input type="number" id="age" placeholder="Your age"/>
            </div>
            <div class="form-group">
                <label>Gender</label>
                <select id="gender">
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>
        <button class="register-btn" onclick="register()">Create Account</button>
        <div id="message"></div>
        <div class="login-link">Already have an account? <a href="/login">Login here</a></div>
    </div>
</div>
<script>
async function register() {
    const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        phone: document.getElementById('phone').value,
        age: parseInt(document.getElementById('age').value),
        gender: document.getElementById('gender').value
    };
    const msg = document.getElementById('message');
    if (!data.name || !data.email || !data.password) {
        msg.className = 'error';
        msg.textContent = 'Please fill in all required fields!';
        return;
    }
    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await response.json();
        if (response.ok) {
            localStorage.setItem('token', result.token);
            localStorage.setItem('name', result.name);
            localStorage.setItem('patientId', result.id);
            msg.className = 'success';
            msg.textContent = '✅ Account created! Redirecting...';
            setTimeout(() => window.location.href = '/patient-dashboard', 1500);
        } else {
            msg.className = 'error';
            msg.textContent = result.message;
        }
    } catch(e) {
        msg.className = 'error';
        msg.textContent = 'Connection error. Is the server running?';
    }
}
</script>
</body>
</html>
